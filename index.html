<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flashcard Natureza - Tubarões</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@500;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <h2>Descubra a verdade passando o mouse</h2>

    <section>

      <article class="flashcard">

        <div class="cartao">

          <!-- FRENTE DO CARTÃO -->
          <div class="cartao-frente">

            <div class="container-imagem">

              <img
                src="https://images.unsplash.com/photo-1560275619-4662e36fa65c?auto=format&fit=crop&w=800&q=80"
                alt="Tubarão nadando no oceano"
                class="cartao-imagem"
              >

            </div>

            <p>
              Tubarões precisam nadar o tempo todo para não morrer!
            </p>

          </div>


          <!-- VERSO DO CARTÃO -->
          <div class="cartao-verso">

            <div class="container-imagem">

              <img
                src="https://images.unsplash.com/photo-1560275619-4662e36fa65c?auto=format&fit=crop&w=800&q=80"
                alt="Tubarão nadando no oceano"
                class="cartao-imagem"
              >

            </div>

            <p>
              Isso é um mito! Embora algumas espécies precisem nadar
              continuamente para manter a água passando pelas brânquias,
              outras conseguem ficar paradas ou descansar no fundo do mar.
            </p>

          </div>

        </div>

      </article>

    </section>

  </main>

</body>
</html>
